[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "5g-nr-channel-condition"
version = "0.2.0"
description = "Research framework for 5G NR channel condition analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6.0",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.7", "mypy>=1.10"]
sionna = ["sionna-no-rt==2.2.0", "torch>=2.9"]
sionna-rt = ["sionna-no-rt==2.2.0", "sionna-rt==2.2.0", "torch>=2.9"]
boosting = ["xgboost-cpu>=2.1,<4"]
plots = ["matplotlib>=3.8,<4", "Pillow>=10"]
docs = [
  "myst-nb>=1.2",
  "myst-parser>=4.0",
  "pydata-sphinx-theme>=0.19",
  "sphinx>=8.2",
  "sphinx-autoapi>=3.6",
  "sphinx-design>=0.6",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'", extra = "sionna" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'", extra = "sionna-rt" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.scripts]
nr-agent = "agentops.cli:main"
loslab = "loslab.__main__:main"
loslab-audit-channel-population = "scripts.audit_channel_population:main"
loslab-audit-odbl-scene-source = "scripts.audit_odbl_scene_source_snapshot:main"
loslab-pilot = "experiments.pilot_cli:main"
loslab-runtime-inventory = "integrations.runtime_inventory:main"
loslab-build-implementation-feature-map = "scripts.build_implementation_feature_map:main"
loslab-report-standardized-capabilities = "scripts.report_standardized_capabilities:main"
loslab-build-standardized-split-registry = "scripts.build_standardized_split_registry:main"
loslab-audit-helper-wiring = "scripts.audit_helper_wiring:main"
loslab-bind-split-registry-children = "scripts.bind_split_registry_children:main"
loslab-pair-stored-frequency-views = "scripts.pair_stored_frequency_views:main"
loslab-materialize-direct-path-ablation = "scripts.materialize_direct_path_ablation:main"
loslab-materialize-benchmark-partitions = "scripts.materialize_benchmark_partitions:main"
loslab-build-result-promotion-manifest = "scripts.build_result_promotion_manifest:main"
loslab-g3-joint-evidence = "evaluation.joint_evidence_artifact:main"
loslab-verify-g3-run-report-signature = "scripts.verify_run_report_signature:main"
loslab-export-public-release = "scripts.export_public_release:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "artifacts*",
  "configuration*",
  "datasets*",
  "propagation*",
  "receivers*",
  "models*",
  "learning*",
  "evaluation*",
  "experiments*",
  "integrations*",
  "compute*",
  "loslab*",
  "scripts*",
  "agentops*",
]
exclude = ["tests*", "archive*", "notebooks*"]

[tool.setuptools.package-data]
agentops = ["schema/*.json"]
datasets = ["schema/*.json", "schema/**/*.json"]
experiments = ["schema/*.json"]
evaluation = ["schema/*.json"]
compute = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-q",
  "--cov",
  "--cov-report=term-missing",
  "--cov-fail-under=75",
]
markers = [
  "integration: tests for optional integrations and external libraries",
  "native_sionna: requires Sionna 2.2 PHY; RT cases additionally require the sionna-rt extra",
]

[tool.coverage.run]
source = ["artifacts", "configuration", "datasets", "propagation", "receivers", "models", "learning", "evaluation", "experiments", "integrations", "compute", "loslab", "agentops"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["artifacts", "configuration", "datasets", "propagation", "receivers", "models", "learning", "evaluation", "experiments", "integrations", "compute", "loslab", "scripts", "agentops"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D2", "D3", "D4"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D205"]

[tool.mypy]
python_version = "3.11"
files = [
  "artifacts",
  "configuration",
  "datasets",
  "propagation",
  "receivers",
  "models",
  "learning",
  "evaluation",
  "experiments",
  "integrations",
  "compute",
  "loslab",
  "scripts",
  "agentops",
]
ignore_missing_imports = true
check_untyped_defs = true
