[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "5g-nr-channel-condition"
version = "0.2.0"
description = "Research framework for 5G NR channel condition analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.7", "mypy>=1.10", "jsonschema>=4.23,<5"]
sionna = ["sionna-no-rt==2.2.0", "torch>=2.9"]
sionna-rt = ["sionna-no-rt==2.2.0", "sionna-rt==2.2.0", "torch>=2.9"]
boosting = ["xgboost-cpu>=2.1,<4"]
plots = ["matplotlib>=3.8,<4", "Pillow>=10"]

[project.scripts]
loslab = "loslab.__main__:main"
loslab-audit-channel-population = "scripts.audit_channel_population:main"
loslab-audit-odbl-scene-source = "scripts.audit_odbl_scene_source_snapshot:main"
loslab-pilot = "experiments.pilot_cli:main"
loslab-runtime-inventory = "integrations.runtime_inventory:main"
loslab-build-implementation-feature-map = "scripts.build_implementation_feature_map:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "artifacts*", "configuration*", "datasets*", "propagation*", "receivers*",
  "models*", "learning*", "evaluation*", "experiments*", "integrations*",
  "compute*", "loslab*",
]
exclude = ["tests*", "archive*", "notebooks*", "scripts*"]

[tool.setuptools.package-data]
datasets = ["schema/*.json", "schema/**/*.json"]
evaluation = ["schema/*.json"]
compute = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-q",
  "--cov=artifacts",
  "--cov=configuration",
  "--cov=datasets",
  "--cov=propagation",
  "--cov=receivers",
  "--cov=models",
  "--cov=learning",
  "--cov=evaluation",
  "--cov=experiments",
  "--cov=integrations",
  "--cov=loslab",
  "--cov-report=term-missing",
  "--cov-fail-under=75",
]
markers = [
  "integration: tests for optional integrations and external libraries",
  "native_sionna: requires Sionna 2.2 PHY; RT cases additionally require the sionna-rt extra",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["artifacts", "configuration", "datasets", "propagation", "receivers", "models", "learning", "evaluation", "experiments", "integrations", "compute", "loslab"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = [
  "artifacts", "configuration", "datasets", "propagation", "receivers",
  "models", "learning", "evaluation", "experiments", "integrations",
  "compute", "loslab", "scripts",
]
ignore_missing_imports = true
check_untyped_defs = true
