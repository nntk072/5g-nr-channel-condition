name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job calls one named gate from tools/check, so the same command runs locally.
jobs:
  lock:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lockfile
        run: ./tools/check lock

  lint:
    name: Lint and format
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project and test dependencies
        run: uv sync --locked --extra dev

      - name: Lint and check formatting
        run: ./tools/check lint

  typecheck:
    name: Type check
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project and test dependencies
        run: uv sync --locked --extra dev

      - name: Type check
        run: ./tools/check typecheck

  test:
    name: Core tests (Python 3.12)
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project and test dependencies
        run: uv sync --locked --extra dev

      - name: Run core tests
        run: ./tools/check test

  neural:
    name: Neural and boosted baseline tests (Python 3.12)
    needs: lock
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project and development dependencies
        run: uv sync --locked --extra dev --extra boosting --extra sionna --no-install-package torch

      - name: Install CPU-only PyTorch
        run: uv pip install --python .venv/bin/python torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run neural and boosted tests with coverage
        shell: bash
        run: |
          set -o pipefail
          ./tools/check neural 2>&1 | tee neural-test-output.txt

      - name: Keep neural test output and coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-test-output
          path: |
            neural-test-output.txt
            .coverage*
          if-no-files-found: warn
          retention-days: 14

  architecture:
    name: Architecture and coverage policy
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project and test dependencies
        run: uv sync --locked --extra dev

      - name: Architecture, package lists and coverage policy
        run: ./tools/check architecture

  docs:
    name: Documentation build
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install documentation dependencies
        run: uv sync --locked --extra dev --extra docs

      - name: Build the Sphinx site with warnings as errors
        run: ./tools/check docs

  build:
    name: Build package and import smoke
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project and test dependencies
        run: uv sync --locked --extra dev

      - name: Build and import-smoke the package
        run: ./tools/check build

  ci-success:
    name: CI result
    if: always()
    needs: [lock, lint, typecheck, architecture, docs, test, neural, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = {name: value["result"] for name, value in needs.items() if value["result"] != "success"}
          if failed:
              print(f"Required CI jobs failed or were skipped: {failed}", file=sys.stderr)
              raise SystemExit(1)
          print("All required CI jobs passed")
          PY
